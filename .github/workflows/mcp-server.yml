name: MCP Server

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/mcp-server/**'
      - 'docker/mcp-server/**'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tools/mcp-server/**'
      - 'docker/mcp-server/**'
      - '.github/workflows/mcp-server.yml'
  # Manual trigger with optional container publish
  workflow_dispatch:
    inputs:
      publish_container:
        description: 'Publish container image to GHCR'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}

jobs:
  # ---- Lint, Build, Test ----
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tools/mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

  # ---- Version Sync Check ----
  # Ensures the MCP server version stays in sync with the root package.json
  version-check:
    name: Version Sync Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version alignment
        run: |
          ROOT_VERSION=$(jq -r .version package.json)
          MCP_VERSION=$(jq -r .version tools/mcp-server/package.json)

          echo "Root package.json version: $ROOT_VERSION"
          echo "MCP server package.json version: $MCP_VERSION"

          if [[ "$ROOT_VERSION" != "$MCP_VERSION" ]]; then
            echo "::error::MCP server version ($MCP_VERSION) differs from root version ($ROOT_VERSION). Fix: cd tools/mcp-server && npm run sync-version"
            exit 1
          fi

  # ---- Docker Build Test (PRs only) ----
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/mcp-server/Dockerfile
          push: false
          tags: civic-os/mcp-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Container Publish (manual trigger or called from build-containers.yml) ----
  publish:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.publish_container == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          VERSION=$(jq -r .version tools/mcp-server/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing MCP server version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/mcp-server
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.version.outputs.VERSION }}
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=sha,format=short,prefix=sha-

      - name: Build and push MCP Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
