# Minimal Civic OS stack for the authenticated pa11y accessibility gate in CI
# (.github/workflows/accessibility.yml). Postgres (with Sqitch migrations +
# the pothole example schema), PostgREST, and Keycloak only - no minio,
# inbucket, worker, or swagger. No persistent volumes: every CI run starts
# from a clean database.
#
# PostgREST uses the custom image (docker/postgrest/Dockerfile) which auto-
# fetches Keycloak's JWKS on startup — no manual fetch-keycloak-jwk.sh needed.
#
# Local rehearsal from the repo root:
#   docker compose -f docker/ci-a11y/docker-compose.yml up -d --build

services:
  postgres:
    build:
      context: ../..
      dockerfile: docker/dev-postgres/Dockerfile
    # postgis/postgis has no arm64 manifest; amd64 matches CI runners and
    # runs under emulation on Apple Silicon (same as the example composes).
    platform: linux/amd64
    environment:
      POSTGRES_DB: civic_os_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: civic_os_ci
    volumes:
      - ../../sqitch.conf:/civic-os-migrations/sqitch.conf:ro
      - ../../sqitch.plan:/civic-os-migrations/sqitch.plan:ro
      - ../../postgres/migrations:/civic-os-migrations/postgres/migrations:ro
      - ../../examples/pothole/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - ci-a11y
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d civic_os_db"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 120s

  postgrest:
    build:
      context: ../..
      dockerfile: docker/postgrest/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:civic_os_ci@postgres:5432/civic_os_db
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_DB_PRE_REQUEST: "metadata.check_jwt"
      PGRST_JWT_SECRET: "@/etc/postgrest/jwt-secret.jwks"
      PGRST_JWT_AUD: "account"
      PGRST_LOG_LEVEL: "info"
      PGRST_ADMIN_SERVER_PORT: 3001
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: civic-os-dev
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - ci-a11y
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8082:8080"
    command: start-dev --import-realm
    volumes:
      - ../../examples/keycloak:/opt/keycloak/data/import:ro
    networks:
      - ci-a11y
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  ci-a11y:
    driver: bridge
